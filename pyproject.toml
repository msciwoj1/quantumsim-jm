[project]
name = "quantumsim"
version = "0.1.0"
description = "Quantum simulations in python"
readme = "README.md"
authors = [
  { name = "msciwoj1", email = "cazolim@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
  "numpy >= 2.5.0",
  "scipy >= 1.18.0",
  "matplotlib >= 3.11.0"]
license-files = ["LICEN[CS]E*",]

[project.urls]
Repository = "https://github.com/msciwoj1/quantumsim-jm.git"


[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]
